# 节点由 proxy-providers.ssrdog 拉取；换订阅只改 secrets.yaml 中对应 url
# 多区域架构：rule-set 统一分类，流量与 DNS 共用 PROXY-{REGION} → CHAIN-PROXY-{REGION}；详见 docs/multi-region-dns.md
# 敏感项（secret、订阅 URL、住宅 SOCKS、订阅域名规则）见 secrets.yaml，部署时由 merge_config.py 合并

external-controller: 0.0.0.0:9090
external-ui: /var/lib/mihomo/ui

tun:
  enable: true
  stack: system
  mtu: 1400
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  force-dns-mapping: true

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false

profile:
  store-selected: true
  tracing: false
  store-fake-ip: true

unified-delay: true

hosts:
  localhost.localhost: 127.0.0.1

dns:
  enable: true
  ipv6: false
  respect-rules: true
  listen: "0.0.0.0:1053"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver-policy:
    "geosite:cn,private":
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT

    # AI 流量 rules 固定美国链，DNS 也固定美国（不受 DNS-REGION 影响）
    "rule-set:Claude,Chatgpt,Gemini,Google,Grok":
      - https://cloudflare-dns.com/dns-query#CHAIN-PROXY-US
      - https://dns.google/dns-query#CHAIN-PROXY-US
  # 其余境外域名：走面板 DNS-REGION（需与 FINAL 所选区域链一致）
  nameserver:
    - https://cloudflare-dns.com/dns-query#DNS-REGION
    - https://dns.google/dns-query#DNS-REGION
  fake-ip-filter: ["*.lan", localhost.ptlogin2.qq.com, dns.msftncsi.com, "*.srv.nintendo.net", "*.stun.playstation.net", "xbox.*.microsoft.com", "*.xboxlive.com", "host.docker.internal", "*.internal", "*.localhost", "time.*.com", "time.*.gov", "ntp.*.com", "*.ntp.org"]
  fallback:
    - https://cloudflare-dns.com/dns-query#DNS-REGION
    - https://dns.google/dns-query#DNS-REGION
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  fallback-filter: { geoip: true, geoip-code: CN, ipcidr: [240.0.0.0/4] }

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]

proxy-providers:
  ssrdog:
    type: http
    interval: 43200
    path: ./providers/ssrdog.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
    header:
      User-Agent:
        - ClashforWindows/0.20.39
      Accept:
        - "*/*"
  us:
    type: http
    interval: 43200
    path: ./providers/us.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
    header:
      User-Agent:
        - ClashforWindows/0.20.39
      Accept:
        - "*/*"
  jp:
    type: http
    interval: 43200
    path: ./providers/jp.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
    header:
      User-Agent:
        - ClashforWindows/0.20.39
      Accept:
        - "*/*"

proxy-groups:
  - name: SSRDOG
    type: url-test
    use:
      - ssrdog
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: US
    type: url-test
    use:
      - us
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: JP
    type: url-test
    use:
      - jp
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: BiliBili
    type: select
    proxies: [DIRECT, SSRDOG]

  - name: YouTube
    type: select
    proxies: [US, SSRDOG]

  - name: CHAIN-PROXY-US
    type: url-test
    proxies:
      - HOME-SOCKS5-US
      - HOME-SOCKS5-SSRDOG-US
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true
    hidden: true

  - name: CHAIN-PROXY-DE
    type: url-test
    proxies:
      - HOME-SOCKS5-DE
      - HOME-SOCKS5-SSRDOG-DE
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true
    hidden: true

  # 面板手动选择与当前境外出口一致；未命中 nameserver-policy 的域名均走此组
  - name: DNS-REGION
    type: select
    proxies: [CHAIN-PROXY-US, US, JP, CHAIN-PROXY-DE]


  - name: FINAL
    type: select
    proxies: [SSRDOG, US, JP, CHAIN-PROXY-US, CHAIN-PROXY-DE, DIRECT]

rule-providers:
  DIRECT: { type: file, behavior: classical, path: ./ruleset/DIRECT.yml }
  REJECT: { type: file, behavior: classical, path: ./ruleset/REJECT.yml }
  Chatgpt: { type: file, behavior: classical, path: ./ruleset/Chatgpt.yml }
  Claude: { type: file, behavior: classical, path: ./ruleset/Claude.yml }
  Gemini: { type: file, behavior: classical, path: ./ruleset/Gemini.yml }
  Google: { type: file, behavior: classical, path: ./ruleset/Google.yml }
  Grok: { type: file, behavior: classical, path: ./ruleset/Grok.yml }
  YouTube: { type: file, behavior: classical, path: ./ruleset/YouTube.yml }
  ChinaMax: { type: file, behavior: classical, path: ./ruleset/ChinaMax.yml }
rules:

  - "DOMAIN,dog.ssrdog.com,SSRDOG"
  - "RULE-SET,REJECT,REJECT"
  - "RULE-SET,Claude,CHAIN-PROXY-US"
  - "RULE-SET,Chatgpt,CHAIN-PROXY-US"
  - "RULE-SET,Gemini,CHAIN-PROXY-US"
  - "RULE-SET,Google,CHAIN-PROXY-US"
  - "RULE-SET,Grok,CHAIN-PROXY-US"
  - "DOMAIN-SUFFIX,bilibili.com,BiliBili"
  - "DOMAIN-SUFFIX,hdslb.com,BiliBili"
  - "DOMAIN-SUFFIX,biliapi.net,BiliBili"
  - "DOMAIN-SUFFIX,bilivideo.com,BiliBili"
  - "RULE-SET,YouTube,YouTube"
  - "RULE-SET,DIRECT,DIRECT"
  - "RULE-SET,ChinaMax,DIRECT"
  - "MATCH,FINAL"
